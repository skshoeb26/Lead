name: Android APK

# Builds the LeadPilot AI APK and publishes it as a GitHub Release asset with a stable download link:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/LeadPilot-AI.apk
#
# Optional repository configuration (Settings → Secrets and variables → Actions):
#   Variables: LEADPILOT_API_BASE_URL   default server URL baked into the app (https://api.yourdomain.com)
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  (stable release signing)
#              GOOGLE_SERVICES_JSON     (enables Firebase push notifications)

on:
  push:
    branches: ['main', 'ccr-**']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Configure production environment
        env:
          API_BASE_URL: ${{ vars.LEADPILOT_API_BASE_URL }}
          HAS_PUSH: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiBaseUrl: '${API_BASE_URL}',
            allowInsecureHttp: false,
            pushEnabled: ${HAS_PUSH},
            appVersion: '${VERSION_NAME}',
          };
          EOF
          cat src/environments/environment.prod.ts

      - name: Unit tests
        run: npm run test:ci

      - name: Build web app and sync Capacitor
        run: npm run build:prod && npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on GitHub runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "LEADPILOT_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: mobile/android
        env:
          LEADPILOT_VERSION_CODE: ${{ github.run_number }}
          LEADPILOT_VERSION_NAME: ${{ env.VERSION_NAME }}
          LEADPILOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEADPILOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEADPILOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/release/*.apk ../../out/LeadPilot-AI.apk
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: LeadPilot-AI-${{ env.VERSION_NAME }}
          path: out/LeadPilot-AI.apk

      - name: Publish release (stable link)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then SIGN_NOTE="Signed with the project release key — installs as an update over previous builds."
          else SIGN_NOTE="⚠️ Signed with a temporary CI debug key (release signing secrets not configured). Uninstall the previous build before installing this one."; fi
          NOTES="LeadPilot AI ${VERSION_NAME} (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}, branch ${GITHUB_REF_NAME}).

          ${SIGN_NOTE}

          Install: download LeadPilot-AI.apk on your phone → open → allow 'Install unknown apps' for your browser/files app (Xiaomi: Settings → Privacy → Special permissions → Install unknown apps)."
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest out/LeadPilot-AI.apk --title "LeadPilot AI ${VERSION_NAME} (latest APK)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          gh release create "apk-v${VERSION_NAME}" out/LeadPilot-AI.apk --title "LeadPilot AI ${VERSION_NAME}" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/LeadPilot-AI.apk" >> "$GITHUB_STEP_SUMMARY"
