name: Deploy backend (manual)

# Manual only. Requires a GitHub "production" environment (add required reviewers for an approval gate) with secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY  and the repo checked out at ~/Lead on the server with deploy/.env in place.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/Lead
            git fetch --all --prune
            git checkout "${{ inputs.ref }}"
            git pull --ff-only || true
            cd deploy
            docker compose run --rm --entrypoint /bin/sh backup /backup.sh   # backup before every deploy
            docker compose up -d --build api worker
            docker image prune -f
            sleep 10 && curl -fsS "https://$(grep ^DOMAIN= .env | cut -d= -f2)/health"
